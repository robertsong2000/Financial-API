<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>同花顺 · 市场情绪工作台</title><style>
body{margin:0;background:#071017;color:#edf8f6;font:14px system-ui,"PingFang SC",sans-serif}main{max-width:1400px;margin:auto;padding:26px 20px}.top{display:flex;justify-content:space-between;align-items:center}.muted{color:#8da6a8;font-size:12px}.grid{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:14px;margin-top:18px}.panel{background:#10212bdd;border:1px solid #1e3a45;border-radius:16px;padding:18px;min-width:0}.panel h2{font-size:15px;margin:0 0 14px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}.metric{background:#10212b;border:1px solid #1e3a45;border-radius:13px;padding:14px}.label{color:#8da6a8;font-size:12px}.value{font-size:25px;font-weight:750;margin-top:8px}.up{color:#ff6475}.down{color:#3bd4a5}#seatChart,#boardChart{height:280px}.ladder{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.ladder article{background:#0b1920;border:1px solid #1e3a45;border-radius:10px;padding:10px}.ladder b{font-size:20px;color:#f2ad63}.ladder span{display:block;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:8px 4px;border-bottom:1px solid #1e3a45;font-size:12px}.table th{color:#8da6a8;font-weight:500}.pill{display:inline-block;background:#173b43;border-radius:99px;padding:3px 7px;margin:2px;color:#9ef3df;font-size:11px}.hot{display:flex;justify-content:space-between;border-bottom:1px solid #1e3a45;padding:9px 0}.hot strong{color:#f2ad63}footer{margin-top:18px}@media(max-width:950px){.grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main><div class="top"><div><strong>THS / MARKET SENTIMENT WORKSTATION</strong><div class="muted">龙虎榜 · 连板梯队 · 热股榜</div></div><span class="muted" id="status">连接中…</span></div><div class="metrics"><div class="metric"><div class="label">龙虎榜游资席位</div><div class="value" id="seatCount">—</div><div class="muted" id="tradeDate">—</div></div><div class="metric"><div class="label">最高连板</div><div class="value up" id="maxBoard">—</div><div class="muted">当日涨停梯队</div></div><div class="metric"><div class="label">热股榜数量</div><div class="value" id="hotCount">—</div><div class="muted">同花顺热度日榜</div></div><div class="metric"><div class="label">数据刷新</div><div class="value" id="refresh">60s</div><div class="muted">本地轮询</div></div></div><div class="grid"><section class="panel"><h2>游资净买入 / 净卖出席位</h2><div id="seatChart"></div><table class="table"><thead><tr><th>席位</th><th>金额</th><th>代表标的</th></tr></thead><tbody id="seatTable"></tbody></table></section><section class="panel"><h2>今日连板梯队 <span class="muted" id="ladderDate"></span></h2><div id="boardChart"></div><div class="ladder" id="ladder"></div></section><section class="panel"><h2>热股榜 · 题材线索</h2><div id="hotList"></div><p class="muted">题材标签来自龙虎榜明细，适合做盘前复盘线索。</p></section></div><footer class="muted">数据源：同花顺金融数据服务 API · 本地服务每 60 秒轮询 · 仅供信息展示，不构成投资建议</footer></main><script src="/vendor/echarts.min.js"></script><script>
const $=s=>document.querySelector(s),seatChart=echarts.init($('#seatChart')),boardChart=echarts.init($('#boardChart'));let timer;const money=v=>{const n=Number(v||0),a=Math.abs(n);return (n<0?'-':'')+(a>=1e8?(a/1e8).toFixed(2)+'亿':(a/1e4).toFixed(0)+'万')};
function render(d){const seats=d.dragonTiger.items||[];$('#seatCount').textContent=seats.length;$('#tradeDate').textContent=d.dragonTiger.tradeDate||d.asOf;const groups={};for(const key of ['two_board','three_board','four_board','five_board','six_board','seven_over'])groups[key]=d.ladder.boards?.[key]||[];const boardNumbers={two_board:2,three_board:3,four_board:4,five_board:5,six_board:6,seven_over:7};const entries=Object.entries(groups).map(([k,v])=>[boardNumbers[k],v.length]).filter(x=>x[1]);$('#maxBoard').textContent=entries.length?Math.max(...entries.map(x=>x[0]))+' 板':'—';$('#ladderDate').textContent=' · '+d.ladder.date;$('#hotCount').textContent=(d.hotStock||[]).length;const top=seats.slice().sort((a,b)=>Math.abs(b.buying)-Math.abs(a.buying)).slice(0,8);seatChart.setOption({animation:false,grid:{left:70,right:18,top:12,bottom:28},xAxis:{type:'value',axisLabel:{color:'#8da6a8',formatter:v=>money(v)},splitLine:{lineStyle:{color:'#1e3a45'}}},yAxis:{type:'category',data:top.map(x=>x.name).reverse(),axisLabel:{color:'#edf8f6'}},series:[{type:'bar',data:top.map(x=>({value:x.buying,itemStyle:{color:x.buying>=0?'#ff6475':'#3bd4a5'}})).reverse()}],tooltip:{trigger:'axis',valueFormatter:money}});boardChart.setOption({animation:false,grid:{left:38,right:10,top:20,bottom:28},xAxis:{type:'category',data:entries.map(x=>x[0]+'板'),axisLabel:{color:'#8da6a8'}},yAxis:{type:'value',axisLabel:{color:'#8da6a8'},splitLine:{lineStyle:{color:'#1e3a45'}}},series:[{type:'bar',data:entries.map(x=>x[1]),itemStyle:{color:'#f2ad63'},barWidth:'45%'}],tooltip:{trigger:'axis'}});$('#seatTable').innerHTML=top.slice(0,6).map(x=>{const r=x.rows?.[0];return `<tr><td>${x.name}</td><td class="${x.buying>=0?'up':'down'}">${money(x.buying)}</td><td>${r?.name||'—'}${r?.concept_list?.slice(0,2).map(c=>`<span class="pill">${c.name}</span>`).join('')||''}</td></tr>`}).join('');$('#ladder').innerHTML=Object.entries(groups).filter(([,v])=>v.length).sort((a,b)=>b[1][0].board_num-a[1][0].board_num).map(([k,v])=>`<article><b>${v[0].board_num}板</b><span>${v.slice(0,4).map(x=>x.name).join(' · ')}</span></article>`).join('');$('#hotList').innerHTML=(d.hotStock||[]).slice(0,12).map((x,i)=>`<div class="hot"><span><strong>${i+1}</strong>　${x.name}</span><span class="muted">热度 ${Number(x.heat).toLocaleString()}</span></div>`).join('');}
async function load(){ $('#status').textContent='获取数据中…';try{const r=await fetch('/api/market/overview');const d=await r.json();if(!r.ok)throw Error(d.error);render(d);$('#status').textContent='已连接 · '+new Date().toLocaleTimeString('zh-CN')+' · 60 秒自动刷新';clearTimeout(timer);timer=setTimeout(load,60000)}catch(e){$('#status').textContent='连接失败：'+e.message;timer=setTimeout(load,10000)}}addEventListener('resize',()=>{seatChart.resize();boardChart.resize()});load();
</script></body></html>
