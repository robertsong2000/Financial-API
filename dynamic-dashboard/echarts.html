<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>同花顺动态 K 线 · ECharts</title><style>body{margin:0;background:#081118;color:#eef8f8;font:14px system-ui,"PingFang SC",sans-serif}main{max-width:1280px;margin:auto;padding:28px 20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.muted{color:#91a8ad;font-size:12px}.search{display:flex;gap:8px;margin:40px 0 18px}.search input{background:#10212b;border:1px solid #1e3a45;border-radius:9px;color:#eef8f8;padding:10px;text-transform:uppercase}.search button{background:#47e2c4;border:0;border-radius:9px;padding:10px 16px;font-weight:700}.panel{background:#10212bdd;border:1px solid #1e3a45;border-radius:16px;padding:18px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}.metric{padding:16px;background:#10212b;border:1px solid #1e3a45;border-radius:14px}.label{color:#91a8ad;font-size:12px}.value{font-size:28px;font-weight:750;margin-top:10px}.up{color:#ff6475}.down{color:#3bd4a5}#chart{height:560px}@media(max-width:700px){.metrics{grid-template-columns:repeat(2,1fr)}#chart{height:430px}}</style></head><body><main><div class="top"><strong>THS / ECHARTS LIVE WORKSTATION</strong><span class="muted" id="status">连接中…</span></div><form class="search" id="form"><input id="code" value="300033.SZ" aria-label="股票代码"><button>刷新行情</button></form><div class="metrics"><div class="metric"><div class="label">最新价</div><div class="value" id="price">—</div><div class="muted" id="change">—</div></div><div class="metric"><div class="label">今日成交额</div><div class="value" id="turnover">—</div></div><div class="metric"><div class="label">区间收益</div><div class="value" id="return">—</div></div><div class="metric"><div class="label">历史数据</div><div class="value" id="count">—</div><div class="muted">交易日</div></div></div><section class="panel"><div><strong id="title">前复权日 K · 成交量 · MA20 / MA60</strong><span class="muted" id="meta"></span></div><div id="chart"></div></section><p class="muted">数据源：同花顺金融数据服务 API · 本地服务轮询 · API Key 不进入浏览器 · 仅供信息展示，不构成投资建议</p></main><script src="/vendor/echarts.min.js"></script><script>
const $=s=>document.querySelector(s),chart=echarts.init($('#chart'));let timer;const fmt=v=>Number(v).toLocaleString('zh-CN',{maximumFractionDigits:2}),date=v=>new Date(v).toISOString().slice(0,10);const ma=(a,n)=>a.map((_,i)=>i<n-1?'-':a.slice(i-n+1,i+1).reduce((s,x)=>s+x[1],0)/n);
function render(d){const s=d.snapshot,h=d.history||[],dates=h.map(x=>date(x.date_ms)),ohlc=h.map(x=>[x.open_price,x.close_price,x.low_price,x.high_price]),close=h.map(x=>x.close_price);$('#price').textContent=s?fmt(s.last_price):'—';const pct=s?.price_change_ratio_pct||0;$('#change').textContent=s?`${pct>=0?'+':''}${fmt(pct)}% · ${pct>=0?'上涨':'下跌'}`:'';$('#change').className='muted '+(pct>=0?'up':'down');$('#turnover').textContent=s?fmt(s.turnover/1e8)+' 亿':'—';const ret=close.length?(close.at(-1)/close[0]-1)*100:0;$('#return').textContent=close.length?`${ret>=0?'+':''}${fmt(ret)}%`:'—';$('#return').className='value '+(ret>=0?'up':'down');$('#count').textContent=h.length;$('#title').textContent=`${d.code} · 前复权日 K · 成交量 · MA20 / MA60`;$('#meta').textContent=`　${h.length?date(h[0].date_ms):'—'} → ${h.length?date(h.at(-1).date_ms):'—'}`;chart.setOption({animation:false,legend:{textStyle:{color:'#91a8ad'}},tooltip:{trigger:'axis',axisPointer:{type:'cross'}},grid:[{left:58,right:18,top:42,height:'63%'},{left:58,right:18,top:'80%',height:'14%'}],xAxis:[{type:'category',data:dates,boundaryGap:false,axisLabel:{color:'#91a8ad'}},{type:'category',gridIndex:1,data:dates,show:false}],yAxis:[{scale:true,axisLabel:{color:'#91a8ad'},splitLine:{lineStyle:{color:'#1e3a45'}}},{gridIndex:1,axisLabel:{color:'#91a8ad'},splitLine:{show:false}}],dataZoom:[{type:'inside',xAxisIndex:[0,1],start:65,end:100},{type:'slider',xAxisIndex:[0,1],bottom:4}],series:[{name:'日 K',type:'candlestick',data:ohlc,itemStyle:{color:'#ff6475',color0:'#3bd4a5',borderColor:'#ff6475',borderColor0:'#3bd4a5'}},{name:'MA20',type:'line',data:ma(ohlc.map(x=>[0,x[1]]),20),showSymbol:false,lineStyle:{color:'#47e2c4',width:1.5}},{name:'MA60',type:'line',data:ma(ohlc.map(x=>[0,x[1]]),60),showSymbol:false,lineStyle:{color:'#f2ad63',width:1.5}},{name:'成交量',type:'bar',xAxisIndex:1,yAxisIndex:1,data:h.map(x=>x.volume||0),itemStyle:{color:'#47e2c4',opacity:.5}}]});}
async function load(){const code=$('#code').value.trim().toUpperCase();$('#status').textContent='获取数据中…';try{const r=await fetch('/api/stock?thscode='+encodeURIComponent(code));const d=await r.json();if(!r.ok)throw Error(d.error);render(d);$('#status').textContent='已连接 · 60 秒自动刷新';clearTimeout(timer);timer=setTimeout(load,60000)}catch(e){$('#status').textContent='连接失败：'+e.message}}$('#form').addEventListener('submit',e=>{e.preventDefault();load()});addEventListener('resize',()=>chart.resize());load();
</script></body></html>
